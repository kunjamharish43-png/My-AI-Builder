<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI App Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .glow-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

  <!-- Header -->
  <header class="glass sticky top-0 z-20 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl glow-btn flex items-center justify-center font-bold text-lg">⚡</div>
      <div>
        <h1 class="font-bold text-base leading-tight">AI App Studio</h1>
        <p class="text-[11px] text-indigo-400">Open-Source APK Builder</p>
      </div>
    </div>
    <button onclick="openSettings()" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-medium active:scale-95">
      ⚙️ Settings
    </button>
  </header>

  <!-- Main Content -->
  <main class="p-4 max-w-md w-full mx-auto space-y-4">

    <!-- Prompt Card -->
    <div class="glass rounded-2xl p-4 space-y-3">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kaisa App Banana Hai?</label>
      <textarea id="promptInput" rows="4" placeholder="Example: Ek modern Expense Tracker app banao jisme daily kharcha add, delete aur total balance dikhe..."
        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>

      <!-- Quick Chips -->
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="setPrompt('Ek modern dark mode Scientific Calculator app banao')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">🧮 Calculator</button>
        <button onclick="setPrompt('Ek clean To-Do List aur Task Manager app banao jisme tasks save rahein')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">✅ To-Do App</button>
        <button onclick="setPrompt('Ek Hindi GK Quiz app banao jisme score aur timer ho')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">🧠 Quiz App</button>
      </div>

      <button id="buildBtn" onclick="startBuild()" class="w-full py-3.5 rounded-xl glow-btn font-semibold text-sm active:scale-98 transition">
        🚀 Generate & Build Real APK
      </button>
    </div>

    <!-- Build Tracker Card -->
    <div id="statusCard" class="hidden glass rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-indigo-400 uppercase">Live Build Status</span>
        <span id="statusBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">Working...</span>
      </div>
      <p id="statusText" class="text-sm text-slate-200">AI code likh raha hai...</p>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-500" style="width: 15%"></div>
      </div>
      <a id="downloadLink" href="#" target="_blank" class="hidden block w-full text-center py-3 rounded-xl bg-emerald-600 font-semibold text-sm">
        📥 Open GitHub & Download APK
      </a>
    </div>

    <!-- Code Preview -->
    <div id="codeCard" class="hidden glass rounded-2xl p-4 space-y-2">
      <span class="text-xs font-semibold text-slate-400">Generated Code Preview</span>
      <pre id="codePreview" class="bg-slate-950 p-3 rounded-xl text-[11px] text-emerald-400 overflow-x-auto max-h-48"></pre>
    </div>

  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="glass w-full max-w-sm rounded-2xl p-5 space-y-3">
      <h2 class="font-bold text-lg">API & GitHub Setup</h2>
      <input id="groqKey" type="password" placeholder="Groq API Key (gsk_...)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
      <input id="ghUser" type="text" placeholder="GitHub Username" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
      <input id="ghRepo" type="text" placeholder="Factory Repo Name" value="App-Factory-Template" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
      <input id="ghToken" type="password" placeholder="GitHub Token (ghp_...)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
      <div class="flex gap-2 pt-2">
        <button onclick="closeSettings()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-sm">Cancel</button>
        <button onclick="saveSettings()" class="flex-1 py-2.5 rounded-xl glow-btn text-sm font-semibold">Save</button>
      </div>
    </div>
  </div>

  <script>
    function setPrompt(text) { document.getElementById('promptInput').value = text; }
    function openSettings() {
      document.getElementById('groqKey').value = localStorage.getItem('groqKey') || '';
      document.getElementById('ghUser').value = localStorage.getItem('ghUser') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'App-Factory-Template';
      document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
    function saveSettings() {
      localStorage.setItem('groqKey', document.getElementById('groqKey').value.trim());
      localStorage.setItem('ghUser', document.getElementById('ghUser').value.trim());
      localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
      closeSettings();
      alert('Settings saved!');
    }

    function updateStatus(msg, pct, badge = 'Working...') {
      document.getElementById('statusCard').classList.remove('hidden');
      document.getElementById('statusText').innerText = msg;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('statusBadge').innerText = badge;
    }

    async function startBuild() {
      const prompt = document.getElementById('promptInput').value.trim();
      const groqKey = localStorage.getItem('groqKey');
      const ghUser = localStorage.getItem('ghUser');
      const ghRepo = localStorage.getItem('ghRepo') || 'App-Factory-Template';
      const ghToken = localStorage.getItem('ghToken');

      if (!groqKey || !ghUser || !ghToken) { openSettings(); return alert('Pehle Settings mein apni Keys dalein!'); }
      if (!prompt) return alert('Pehle app ka prompt likhein!');

      document.getElementById('downloadLink').classList.add('hidden');
      updateStatus('1/3: Open-Source AI aapke app ka code likh raha hai...', 25);

      try {
        const aiRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              { role: 'system', content: 'You are an expert mobile UI developer. Return ONLY raw, complete, single-file HTML5 code using Tailwind CSS CDN and working JavaScript. Make it look like a premium modern dark-mode mobile app. Do NOT wrap in markdown code fences or add explanations.' },
              { role: 'user', content: prompt }
            ]
          })
        });
        const aiData = await aiRes.json();
        if (!aiData.choices) throw new Error(aiData.error?.message || 'AI Error');

        let code = aiData.choices[0].message.content.replace(/^```html\n?|```$/g, '').trim();
        document.getElementById('codeCard').classList.remove('hidden');
        document.getElementById('codePreview').innerText = code.slice(0, 600) + '\n...';

        updateStatus('2/3: Code GitHub Factory mein upload ho raha hai...', 55);
        const fileUrl = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/www/index.html`;
        const getFile = await fetch(fileUrl, { headers: { 'Authorization': `token ${ghToken}` } });
        const fileData = await getFile.json();

        const encoded = btoa(unescape(encodeURIComponent(code)));
        const putRes = await fetch(fileUrl, {
          method: 'PUT',
          headers: { 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'AI Generated App Update', content: encoded, sha: fileData.sha })
        });
        if (!putRes.ok) throw new Error('GitHub Upload Failed! Token/Repo check karein.');

        updateStatus('3/3: GitHub cloud par Real APK build shuru ho gaya hai! (2-3 min mein ready hoga)', 100, 'Building APK');
        const link = document.getElementById('downloadLink');
        link.href = `https://github.com/${ghUser}/${ghRepo}/actions`;
        link.classList.remove('hidden');
      } catch (err) {
        updateStatus('Error: ' + err.message, 100, 'Failed');
      }
    }
  </script>
</body>
</html>
